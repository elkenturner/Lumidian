<svg viewBox="0 0 560 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .wmark { fill: #1a1a2e; }
    @media (prefers-color-scheme: dark) {
      .wmark { fill: #e8e8f0; }
    }
  </style>

  <!-- Eye icon (120×60, centered at y=60) -->
  <!-- Black outer eye shape -->
  <path d="M 4,60 C 24,28 96,28 116,60 C 96,92 24,92 4,60 Z" fill="#111111"/>
  <!-- Blue left corner accent -->
  <path d="M 22,60 C 24,48 42,48 44,60 C 42,72 24,72 22,60 Z" fill="#3b63e8"/>
  <!-- Blue right corner accent -->
  <path d="M 98,60 C 96,48 78,48 76,60 C 78,72 96,72 98,60 Z" fill="#3b63e8"/>
  <!-- White sclera -->
  <circle cx="60" cy="60" r="19" fill="white"/>
  <!-- Black pupil -->
  <circle cx="60" cy="60" r="11" fill="#111111"/>

  <!-- Wordmark -->
  <text
    x="140"
    y="76"
    font-family="system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif"
    font-weight="700"
    font-size="42"
    letter-spacing="4"
    class="wmark">Lumidian</text>
</svg>
